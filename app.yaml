# Databricks App Configuration
# Lakebase: Autoscaling project "lakemeter-customer" (production / primary)

command:
  - "/bin/bash"
  - "-c"
  - |
    cd backend && ../.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}

env:
  # App environment
  - name: "ENVIRONMENT"
    value: "production"
  - name: "CORS_ORIGINS"
    value: ""
  - name: "DATABRICKS_HOST"
    value: "https://dbc-73d32922-ac91.cloud.databricks.com"

  # Lakebase Autoscaling database configuration (project: lakemeter-customer)
  - name: "LAKEBASE_PROJECT"
    value: "lakemeter-customer"
  - name: "LAKEBASE_BRANCH"
    value: "production"
  - name: "LAKEBASE_ENDPOINT"
    value: "projects/lakemeter-customer/branches/production/endpoints/primary"
  - name: "DB_HOST"
    valueFrom: "lm-db-host"
  - name: "DB_USER"
    value: "098f898b-8e8a-4dfc-a7e7-85b30c60ba89"
  - name: "DB_NAME"
    value: "lakemeter_pricing"
  - name: "DB_PORT"
    value: "5432"
  - name: "DB_SSLMODE"
    value: "require"

  # AI Assistant model serving endpoint
  - name: "CLAUDE_MODEL_ENDPOINT"
    value: "databricks-qwen3-next-80b-a3b-instruct"
